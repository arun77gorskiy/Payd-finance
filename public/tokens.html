<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discovery Engine — Token Catalog (339 верифицированных)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0e1a; color: #e2e8f0; padding: 20px; }
        h1 { color: #60a5fa; margin-bottom: 10px; font-size: 28px; }
        .subtitle { color: #94a3b8; margin-bottom: 24px; font-size: 14px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .stat-card { background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid #334155; border-radius: 12px; padding: 16px; }
        .stat-value { font-size: 28px; font-weight: 700; color: #60a5fa; }
        .stat-label { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }
        .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .filter-btn { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; transition: all 0.15s; }
        .filter-btn:hover { background: #334155; }
        .filter-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
        .search { width: 100%; max-width: 400px; padding: 10px 14px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 14px; margin-bottom: 16px; }
        .tokens-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
        .token-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 12px; transition: all 0.15s; cursor: pointer; }
        .token-card:hover { border-color: #60a5fa; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(96, 165, 250, 0.1); }
        .token-symbol { font-size: 16px; font-weight: 700; color: #f1f5f9; margin-bottom: 4px; }
        .token-name { font-size: 12px; color: #94a3b8; margin-bottom: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .token-meta { display: flex; gap: 6px; flex-wrap: wrap; }
        .badge { font-size: 10px; padding: 2px 8px; border-radius: 999px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
        .badge-sector { background: #1e3a8a; color: #93c5fd; }
        .badge-tier-1 { background: #166534; color: #bbf7d0; }
        .badge-tier-2 { background: #854d0e; color: #fde68a; }
        .badge-tier-3 { background: #7c2d12; color: #fed7aa; }
        .badge-verified { background: #0e7490; color: #a5f3fc; }
        .back-link { display: inline-block; margin-bottom: 16px; color: #60a5fa; text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
        .count-display { color: #94a3b8; font-size: 14px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <a href="/index.html" class="back-link">← Назад на главную</a>
    <h1>🪙 Token Catalog</h1>
    <p class="subtitle">Верифицированный датасет проектов Discovery Engine</p>

    <div class="stats" id="stats"></div>

    <input type="text" class="search" id="search" placeholder="Поиск по символу, имени или ID...">

    <div class="filters" id="filters"></div>

    <div class="count-display" id="count-display">Загрузка...</div>
    <div class="tokens-grid" id="tokens-grid"></div>

    <script>
        let allProjects = [];
        let currentSector = 'all';
        let searchQuery = '';

        async function loadProjects() {
            try {
                const response = await fetch('/data/projects.json');
                const projects = await response.json();
                allProjects = projects;
                renderStats(projects);
                renderFilters(projects);
                renderTokens(projects);
            } catch (error) {
                document.getElementById('count-display').textContent = 'Ошибка загрузки: ' + error.message;
                document.getElementById('count-display').style.color = '#f87171';
            }
        }

        function renderStats(projects) {
            const bySector = {};
            projects.forEach(p => { bySector[p.sector] = (bySector[p.sector] || 0) + 1; });
            const tiers = projects.filter(p => p.tier === 'tier1').length;
            const verified = projects.filter(p => p.verifiedStatus === 'verified').length;
            const withMulti = projects.filter(p => p.sectors && p.sectors.length > 1).length;

            const statsHtml = `
                <div class="stat-card">
                    <div class="stat-value">${projects.length}</div>
                    <div class="stat-label">Всего токенов</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${Object.keys(bySector).length}</div>
                    <div class="stat-label">Секторов</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${tiers}</div>
                    <div class="stat-label">Tier 1</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${verified}</div>
                    <div class="stat-label">Verified</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${withMulti}</div>
                    <div class="stat-label">Мульти-сектор</div>
                </div>
            `;
            document.getElementById('stats').innerHTML = statsHtml;
        }

        function renderFilters(projects) {
            const sectors = [...new Set(projects.map(p => p.sector))].sort();
            const filtersHtml = ['all', ...sectors].map(s => {
                const label = s === 'all' ? `Все (${projects.length})` : `${s} (${projects.filter(p => p.sector === s).length})`;
                return `<button class="filter-btn ${s === 'all' ? 'active' : ''}" data-sector="${s}">${label}</button>`;
            }).join('');
            document.getElementById('filters').innerHTML = filtersHtml;

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentSector = btn.dataset.sector;
                    renderTokens(allProjects);
                });
            });
        }

        function renderTokens(projects) {
            let filtered = projects;
            if (currentSector !== 'all') {
                filtered = filtered.filter(p => p.sector === currentSector);
            }
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                filtered = filtered.filter(p =>
                    (p.symbol && p.symbol.toLowerCase().includes(q)) ||
                    (p.id && p.id.toLowerCase().includes(q)) ||
                    (p.name && p.name.toLowerCase().includes(q)) ||
                    (p.description && p.description.toLowerCase().includes(q))
                );
            }

            document.getElementById('count-display').textContent = `Показано ${filtered.length} из ${allProjects.length} токенов`;

            const html = filtered.map(p => {
                const tierClass = p.tier === 'tier1' ? 'badge-tier-1' : p.tier === 'tier2' ? 'badge-tier-2' : 'badge-tier-3';
                return `
                    <div class="token-card" data-id="${p.id}">
                        <div class="token-symbol">${p.symbol || p.id}</div>
                        <div class="token-name">${p.name || p.id}</div>
                        <div class="token-meta">
                            <span class="badge badge-sector">${p.sector}</span>
                            <span class="badge ${tierClass}">${p.tier || 'tier3'}</span>
                            <span class="badge badge-verified">${p.verifiedStatus || 'verified'}</span>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('tokens-grid').innerHTML = html;
        }

        document.getElementById('search').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderTokens(allProjects);
        });

        loadProjects();
    </script>
</body>
</html>
