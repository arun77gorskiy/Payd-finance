name: Stage5B CMC Reconcile

on:
  push:
    branches:
      - stage5b/vercel-deployment
    paths:
      - .github/workflows/stage5b-cmc-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Stage5B branch
        uses: actions/checkout@v4
        with:
          ref: stage5b/vercel-deployment
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconcile high-confidence CMC mappings
        run: node scripts/reconcile-cmc-stage5b.mjs

      - name: Run Stage5B tests
        run: npm test

      - name: Commit reconciled index and report
        shell: bash
        run: |
          git config user.name "payd-stage5b-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/intelligence/token-index.json reports/cmc-reconcile-stage5b.json
          if git diff --cached --quiet; then
            echo "No reconciled changes to commit."
            exit 0
          fi
          git commit -m "fix(stage5b): reconcile high-confidence CMC mappings"
          git push origin HEAD:stage5b/vercel-deployment
